<!-- public/components/header.html -->
<header id="siteHeader" class="header">
    <button id="openSidebar" class="menu-btn" aria-label="Odpri meni" aria-controls="sidebar" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
            <line x1="4" y1="6" x2="20" y2="6"></line>
            <line x1="4" y1="12" x2="20" y2="12"></line>
            <line x1="4" y1="18" x2="20" y2="18"></line>
        </svg>
    </button>

    <a href="/" class="header-brand" aria-label="Piflar.si — domov">
        <span class="header-brand-text">Piflar<span class="header-brand-dot">.</span>si</span>
    </a>

    <form id="iskalnik" class="iskalnik" action="/iskanje.html" method="get" role="search" autocomplete="off">
        <svg class="iskalnik-ikona" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
        </svg>
        <input id="iskalnikVnos" class="iskalnik-vnos" type="search" name="q" placeholder="Išči po snovi …" aria-label="Išči po snovi"
            role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="iskalnikPredlogi" minlength="2" maxlength="100">
        <div id="iskalnikPredlogi" class="iskalnik-predlogi" role="listbox" aria-label="Predlogi iskanja" hidden></div>
    </form>

    <div class="header-actions">
        <button id="iskalnikOdpri" class="header-ikona iskalnik-odpri" type="button" aria-label="Odpri iskanje" aria-controls="iskalnik" aria-expanded="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
            </svg>
        </button>
        <button id="temaPreklop" class="header-ikona" type="button" aria-label="Vklopi temni način" aria-pressed="false">
            <svg class="tema-luna" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
            </svg>
            <svg class="tema-sonce" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4.5"></circle>
                <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
            </svg>
        </button>
        <span id="currentDate" class="header-date"></span>
        <a href="/narocnina.html" class="header-link">Naročnina</a>
        <div id="uporabnik" class="header-uporabnik">
            <a href="/prijava.html" class="header-link">Prijava</a>
        </div>
    </div>
</header>
